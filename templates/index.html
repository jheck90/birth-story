<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby is on the way!</title>
  <style>
    /* Aura theme — https://github.com/daltonmenezes/aura-theme */
    :root {
      --bg:        #15141b;
      --surface:   #1e1c28;
      --border:    #3d375e;
      --fg:        #edecee;
      --muted:     #6d6d6d;
      --purple:    #a277ff;
      --teal:      #61ffca;
      --blue:      #82e2ff;
      --orange:    #ffca85;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 600;
      color: var(--purple);
      margin-bottom: 0.4rem;
      letter-spacing: 0.01em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      max-width: 620px;
      margin: 2rem auto 4rem;
      padding: 0 1rem;
    }

    #empty {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      margin-top: 3rem;
      font-size: 1.05rem;
    }

    .update {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .update.new {
      animation: slidein 0.3s ease;
    }

    @keyframes slidein {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .dot {
      color: var(--teal);
      font-size: 1rem;
      padding-top: 3px;
      flex-shrink: 0;
    }

    .time {
      font-size: 0.78rem;
      color: var(--blue);
      white-space: nowrap;
      padding-top: 3px;
      min-width: 7rem;
      flex-shrink: 0;
      font-family: monospace;
    }

    .text {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--fg);
    }

    #status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Baby is on the way! ✨</h1>
    <p>Live updates from the {{.FamilyName}} Family</p>
  </header>
  <main>
    <div id="feed">
      {{if not .Updates}}
      <p id="empty">No updates yet — check back soon! 🍼</p>
      {{end}}
      {{range .Updates}}
      <div class="update">
        <span class="dot">●</span>
        <span class="time">{{.Timestamp.Format "Jan 2, 3:04 PM"}}</span>
        <span class="text">{{.Text}}</span>
      </div>
      {{end}}
    </div>
    <p id="status">Connecting for live updates…</p>
  </main>

  <script>
    const feed   = document.getElementById('feed');
    const status = document.getElementById('status');

    function removeEmpty() {
      const el = document.getElementById('empty');
      if (el) el.remove();
    }

    function addUpdate(text, timestamp) {
      removeEmpty();

      const div  = document.createElement('div');
      div.className = 'update new';

      const dot  = document.createElement('span');
      dot.className = 'dot';
      dot.textContent = '●';

      const time = document.createElement('span');
      time.className = 'time';
      const d = new Date(timestamp);
      time.textContent = d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      const txt  = document.createElement('span');
      txt.className = 'text';
      txt.textContent = text; // textContent — no XSS risk

      div.appendChild(dot);
      div.appendChild(time);
      div.appendChild(txt);
      feed.prepend(div);
    }

    const es = new EventSource('/events');

    es.onopen = () => {
      status.textContent = 'Connected — updates will appear automatically.';
    };

    es.onmessage = (e) => {
      const u = JSON.parse(e.data);
      addUpdate(u.text, u.timestamp);
    };

    es.onerror = () => {
      status.textContent = 'Reconnecting…';
    };
  </script>
</body>
</html>
